name: Bug report
description: Report behavior that does not match the product model
title: "bug: "
labels: [needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the page, role, and steps. Do not include real email addresses or private data.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, device, or local Compose

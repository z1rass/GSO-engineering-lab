name: gso-engineering-lab
services:
  api:
    build: .
    env_file:
      - path: .env.local
        required: false
    environment:
      SQLITE_PATH: /data/lab.sqlite
      PORT: 3001
    volumes: ["./data:/data"]
    command: ["npm", "run", "dev:api"]
    ports: ["127.0.0.1:3001:3001"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 20
  web:
    build: .
    environment:
      API_PROXY_TARGET: http://api:3001
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
    depends_on:
      api: { condition: service_healthy }
    command: ["npm", "run", "dev:web"]
    ports: ["127.0.0.1:5173:5173"]
